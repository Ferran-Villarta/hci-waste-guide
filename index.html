<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What Goes Where (prototype)</title>
  <meta name="description" content="Student prototype for CPSC 481: a waste sorting guide. Not an official City of Calgary service.">
  <meta name="theme-color" content="#ffffff">
  <!-- "?v=dev" is replaced with the commit ID when GitHub publishes the site (.github/workflows/pages.yml),
       so phones always download the newest CSS and JS. Leave it as "dev" here. -->
  <link rel="stylesheet" href="css/style.css?v=dev">
</head>
<body>
  <div id="app" tabindex="-1"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <noscript><p class="notice" style="margin:16px">This prototype needs JavaScript. Please turn it on and reload the page.</p></noscript>

  <!-- Plain scripts, in this order (no build step; also works when index.html is opened from a folder). -->
  <script src="js/config.js?v=dev"></script>
  <script src="data/items.js?v=dev"></script>
  <script src="data/demo.js?v=dev"></script>
  <script src="js/store.js?v=dev"></script>
  <script src="js/search.js?v=dev"></script>
  <script src="js/ui.js?v=dev"></script>
  <script src="js/app.js?v=dev"></script>
</body>
</html>
